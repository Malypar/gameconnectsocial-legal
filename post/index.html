<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b10">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data: https:; connect-src https://qcrfhakzogfisqmaejfh.supabase.co; object-src 'none'; base-uri 'self'; form-action 'none'">
  <link rel="icon" href="/assets/gcs-app-icon.png" type="image/png">
  <meta property="og:type" content="article">
  <meta property="og:title" content="A post on Game Connect Social">
  <meta property="og:description" content="See what Players are sharing on Game Connect Social.">
  <meta property="og:image" content="https://gameconnectsocial.com/assets/gcs-social-card.png">
  <meta name="twitter:card" content="summary_large_image">
  <script src="/assets/post-preview.js" defer></script>
  <title>GCS Post — Game Connect Social</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; --ice:#6ec8ff; --ink:#080b10; --panel:#111923; --line:rgba(110,200,255,.28); --muted:#97a6b5; --white:#f7fbff; }
    * { box-sizing: border-box; }
    body { min-width:320px; min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; background:radial-gradient(circle at 50% 5%,rgba(76,174,237,.16),transparent 30rem),var(--ink); color:var(--white); }
    main { width:min(620px,100%); }
    .brand { display:flex; justify-content:center; margin-bottom:22px; }
    .brand img { width:118px; height:auto; }
    .card { overflow:hidden; border:1px solid var(--line); border-radius:18px; background:linear-gradient(145deg,rgba(23,33,45,.96),rgba(9,14,20,.98)); box-shadow:0 24px 80px rgba(0,0,0,.38); }
    .content { padding:22px; }
    .author { display:flex; align-items:center; gap:12px; }
    .avatar { width:46px; height:46px; border-radius:50%; object-fit:cover; background:#1a2530; }
    .name { margin:0; font-weight:800; }
    .handle,.status { margin:3px 0 0; color:var(--muted); font-size:.9rem; }
    .post-copy { margin:22px 0 0; white-space:pre-wrap; line-height:1.55; }
    .media { width:100%; max-height:520px; object-fit:cover; border-top:1px solid rgba(255,255,255,.08); }
    .actions { display:grid; gap:10px; margin-top:16px; }
    .button { min-height:50px; display:flex; align-items:center; justify-content:center; padding:12px 18px; border:1px solid var(--line); border-radius:10px; color:var(--white); text-decoration:none; font-weight:800; }
    .primary { background:var(--ice); color:#06101a; }
    .fine { margin:16px 0 0; color:#748391; text-align:center; font-size:.78rem; }
    [hidden] { display:none!important; }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/" aria-label="Game Connect Social home"><img src="/assets/gcs-wordmark.png" alt="GCS"></a>
    <article class="card" aria-live="polite">
      <div class="content">
        <p class="status" id="status">Loading post…</p>
        <div id="post" hidden>
          <div class="author">
            <img class="avatar" id="avatar" src="/assets/gcs-app-icon.png" alt="">
            <div><p class="name" id="display-name">GCS Player</p><p class="handle" id="handle"></p></div>
          </div>
          <p class="post-copy" id="post-copy"></p>
        </div>
      </div>
      <img class="media" id="post-image" alt="Shared post media" hidden>
    </article>
    <div class="actions">
      <a class="button primary" id="open-app" href="com.unosyn.gameconnect://post">Open in GCS</a>
      <a class="button" href="/#founding-user">Request beta access</a>
    </div>
    <p class="fine">GCS is currently distributed through controlled beta access. The App Store download will replace this beta link when the public listing is live.</p>
  </main>
</body>
</html>
