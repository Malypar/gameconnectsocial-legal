<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index,follow">
  <title>Game Connect Social</title>
  <meta name="description" content="Official legal and support information for the Game Connect Social public beta.">
  <style>
    :root { color-scheme: dark; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #07111f; color: #eaf3ff; line-height: 1.6; }
    main { width: min(720px, calc(100% - 32px)); padding: 48px clamp(24px, 6vw, 56px); background: #0d1b2d; border: 1px solid #26374d; border-radius: 16px; }
    h1 { margin-top: 0; font-size: clamp(2rem, 7vw, 3.5rem); line-height: 1.05; }
    p { color: #cbd8e7; }
    nav { display: flex; flex-wrap: wrap; gap: 12px; margin: 28px 0; }
    nav a { padding: 12px 18px; border: 1px solid #57c9ff; border-radius: 10px; color: #90ddff; text-decoration: none; }
    a { color: #57c9ff; }
  </style>
</head>
<body>
  <main>
    <h1>Game Connect Social</h1>
    <p>Official legal and support information for the Game Connect Social public beta.</p>
    <nav aria-label="Legal navigation">
      <a href="https://gameconnectsocial.com/terms">Terms of Service</a>
      <a href="https://gameconnectsocial.com/privacy">Privacy Policy</a>
    </nav>
    <p>Support and privacy requests: <a href="mailto:support@gameconnectsocial.com">support@gameconnectsocial.com</a></p>
    <p>Game Connect Social is currently operated by Malyk Parker.</p>
  </main>
</body>
</html>
